services:
  vllm-deepseek-r1-8b:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.6.3.post1}
    container_name: vllm-deepseek-r1-8b
    restart: unless-stopped
    ipc: host
    gpus: all
    ports:
      - "127.0.0.1:${VLLM_HOST_PORT:-18000}:8000"
    environment:
      CUDA_VISIBLE_DEVICES: ${GPU_DEVICE:-2}
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICE:-2}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: ${HF_HOME:-/models/huggingface}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - /nfs/wxz/source/huggingface/hub:/models/huggingface
    command:
      - --model
      - ${MODEL_ID:-deepseek-ai/DeepSeek-R1-Distill-Qwen-7B}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-deepseek-r1:8b-vllm}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --max-model-len
      - "${MAX_MODEL_LEN:-8192}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.85}"
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=3).read()\nPY"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
